[project]
name = "hermes-mcp-bridge"
version = "0.1.0"
description = "HTTP MCP bridge between a self-hosted Hermes agent and a remote MCP client, behind Cloudflare Access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DM Consulting" }]
keywords = ["mcp", "model-context-protocol", "hermes", "cloudflare-access", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.scripts]
hermes-mcp-bridge = "hermes_mcp_bridge.__main__:main"

[project.urls]
Source = "https://github.com/mickadoua/hermes-mcp-bridge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_mcp_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
